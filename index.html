<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
